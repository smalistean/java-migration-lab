server:
  port: 8080
  max-http-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: legacy-orders-service
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: false
  redis:
    host: localhost
    port: 6379
  sleuth:
    sampler:
      probability: 0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    probes:
      enabled: true

acme:
  orders:
    pricing-base-url: http://localhost:9090
    pricing-timeout: 5s
    max-lines-per-order: 50
    report-directory: /tmp/acme-reports
    sweep-interval-ms: 60000
  audit:
    enabled: true

logging:
  level:
    com.acme.orders: INFO
    org.hibernate.SQL: WARN
