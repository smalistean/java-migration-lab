server:
  port: 8080
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: legacy-orders-service
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 0.1
  health:
    probes:
      enabled: true

acme:
  orders:
    pricing-base-url: http://localhost:9090
    pricing-timeout: 5s
    max-lines-per-order: 50
    report-directory: /tmp/acme-reports
    sweep-interval-ms: 60000
  audit:
    enabled: true

logging:
  level:
    com.acme.orders: INFO
    org.hibernate.SQL: WARN
