plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
}

group = 'com.acme'
version = '1.4.0-SNAPSHOT'

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

// --- read at CONFIGURATION time, straight from the environment ---
def buildId = System.getenv('BUILD_ID') ?: 'local'
def buildHost = InetAddress.getLocalHost().getHostName()
ext.releaseNotes = new File("${projectDir}/RELEASE_NOTES.txt")

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Mockito is attached as an explicit agent rather than self-attaching at runtime,
// which newer JDKs warn about and will eventually disallow (JEP 451).
configurations { mockitoAgent }
dependencies { mockitoAgent('org.mockito:mockito-core') { transitive = false } }

test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}

// --- custom packaging task ---
class StampBuildTask extends DefaultTask {
    // a live File handle, held as task state
    // marked @Internal in 2021 to silence Gradle's validation warning
    @Internal
    File notesFile
    @Internal
    String stamp

    @TaskAction
    void stampIt() {
        def out = new File(project.buildDir, 'build-info.txt')
        out.parentFile.mkdirs()
        out.text = "stamp=${stamp}\nproject=${project.name}\nversion=${project.version}\n"
        println "Stamped ${out.absolutePath} for project ${project.name}"
    }
}

tasks.register('stampBuild', StampBuildTask) {
    notesFile = releaseNotes
    stamp = "${buildId}@${buildHost}"
}

tasks.register('printReport') {
    doLast {
        println "Report for ${project.name}"
        println "Build dir: ${project.buildDir}"
        println "Java home: ${System.getProperty('java.home')}"
        println "Deps: ${project.configurations.runtimeClasspath.files.size()} jars"
    }
}

jar {
    archiveBaseName = 'orders'
    destinationDirectory = file("${buildDir}/dist")
}

gradle.buildFinished { result ->
    println "Build finished for ${rootProject.name}: ${result.failure ? 'FAILED' : 'OK'}"
}

tasks.named('build') { dependsOn 'stampBuild' }

// used by scripts/scan.sh
tasks.register('printRuntimeClasspath') {
    def cp = sourceSets.main.runtimeClasspath
    doLast { println cp.asPath }
}
