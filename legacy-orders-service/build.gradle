plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.acme'
version = '1.4.0-SNAPSHOT'

// The toolchain decides which JDK compiles and tests the code, independently of the JDK running Gradle.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Mockito is attached as an explicit agent rather than self-attaching at runtime,
// which newer JDKs warn about and will eventually disallow (JEP 451).
configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    def agent = configurations.mockitoAgent
    jvmArgumentProviders.add({ ["-javaagent:${agent.singleFile}".toString()] } as CommandLineArgumentProvider)
}

tasks.named('jar') {
    archiveBaseName = 'orders'
}

/**
 * Writes build/build-info.txt. Inputs and outputs are declared, so the task is
 * up-to-date-checked, cacheable, and never touches the Project model at execution time.
 */
@CacheableTask
abstract class StampBuildTask extends DefaultTask {
    @Input abstract Property<String> getStamp()
    @Input abstract Property<String> getProjectName()
    @Input abstract Property<String> getProjectVersion()
    @OutputFile abstract RegularFileProperty getOutputFile()

    @TaskAction
    void stampIt() {
        outputFile.get().asFile.text =
                "stamp=${stamp.get()}\nproject=${projectName.get()}\nversion=${projectVersion.get()}\n"
    }
}

tasks.register('stampBuild', StampBuildTask) {
    stamp = providers.environmentVariable('BUILD_ID').orElse('local')
    projectName = project.name
    projectVersion = project.version.toString()
    outputFile = layout.buildDirectory.file('build-info.txt')
}

tasks.named('build') { dependsOn 'stampBuild' }

// used by scripts/scan.sh
tasks.register('printRuntimeClasspath') {
    def cp = sourceSets.main.runtimeClasspath
    doLast { println cp.asPath }
}
