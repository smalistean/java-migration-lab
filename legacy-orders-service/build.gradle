plugins {
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
    id 'jacoco'
}

group = 'com.acme'
version = '1.4.0-SNAPSHOT'

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

// --- read at CONFIGURATION time, straight from the environment ---
def buildId = System.getenv('BUILD_ID') ?: 'local'
def buildHost = InetAddress.getLocalHost().getHostName()
ext.releaseNotes = new File("${projectDir}/RELEASE_NOTES.txt")

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2021.0.9'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // distributed tracing, the 2021-era way
    implementation 'org.springframework.cloud:spring-cloud-starter-sleuth'

    // API docs, the 2020-era way
    implementation 'io.springfox:springfox-boot-starter:3.0.0'

    implementation 'org.apache.commons:commons-lang3:3.9'
    implementation 'commons-io:commons-io:2.6'
    implementation 'com.google.guava:guava:30.1-jre'
    implementation 'joda-time:joda-time:2.10.5'

    compileOnly 'org.projectlombok:lombok:1.18.20'
    annotationProcessor 'org.projectlombok:lombok:1.18.20'

    runtimeOnly 'com.h2database:h2'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        // keep JUnit 4 on the classpath: half the suite still uses it
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.junit.vintage:junit-vintage-engine'
    testImplementation 'org.mockito:mockito-core:3.12.4'
    testImplementation 'org.mockito:mockito-inline:3.12.4'
}

test {
    useJUnitPlatform()
    // the APM agent our platform team requires
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

// --- custom packaging task ---
class StampBuildTask extends DefaultTask {
    // a live File handle, held as task state
    // marked @Internal in 2021 to silence Gradle's validation warning
    @Internal
    File notesFile
    @Internal
    String stamp

    @TaskAction
    void stampIt() {
        def out = new File(project.buildDir, 'build-info.txt')
        out.parentFile.mkdirs()
        out.text = "stamp=${stamp}\nproject=${project.name}\nversion=${project.version}\n"
        println "Stamped ${out.absolutePath} for project ${project.name}"
    }
}

tasks.register('stampBuild', StampBuildTask) {
    notesFile = releaseNotes
    stamp = "${buildId}@${buildHost}"
}

tasks.register('printReport') {
    doLast {
        println "Report for ${project.name}"
        println "Build dir: ${project.buildDir}"
        println "Java home: ${System.getProperty('java.home')}"
        println "Deps: ${project.configurations.runtimeClasspath.files.size()} jars"
    }
}

jar {
    archiveBaseName = 'orders'
    destinationDirectory = file("${buildDir}/dist")
}

gradle.buildFinished { result ->
    println "Build finished for ${rootProject.name}: ${result.failure ? 'FAILED' : 'OK'}"
}

tasks.named('build') { dependsOn 'stampBuild' }

// used by scripts/scan.sh
tasks.register('printRuntimeClasspath') {
    def cp = sourceSets.main.runtimeClasspath
    doLast { println cp.asPath }
}
